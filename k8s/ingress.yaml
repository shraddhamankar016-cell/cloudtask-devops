apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtask-ingress
  namespace: cloudtask
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - host: cloudtask.example.com   # replace with your domain / ALB DNS
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudtask-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtask-frontend
                port:
                  number: 80
