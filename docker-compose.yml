version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cloudtask-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - cloudtask-net

  frontend:
    build: ./frontend
    container_name: cloudtask-frontend
    ports:
      - "3000:80"
    environment:
      - API_URL=http://localhost:8080/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloudtask-net

networks:
  cloudtask-net:
    driver: bridge
